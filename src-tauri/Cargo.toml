[package]
name = "marky"
version = "0.5.1"
description = "Markdown Editor"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "marky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "~2.7"
xattr = "1.6.1" # Preserve ACLs and extended attributes during atomic saves.

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
# Filters WebKit's default context menu (see the context-menu handler in lib.rs).
# Must stay on the same major version wry builds against (2.x).
webkit2gtk = "2.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
