# Betterleaks configuration, passed explicitly with `--config .betterleaks.toml`
# by the `secrets` and `secrets-staged` recipes. The default rules stay on; the
# only addition is an allowlist for build output, which is generated from the
# sources this scan already covers, so a finding inside it repeats a finding
# about a source file or reports a vendored crate's compiled metadata. The
# recurring noise is `libmuda` metadata under `src-tauri/target/` and a
# NetworkManager schema bundled into the AppImage; CI scans a clean checkout,
# where neither exists.
[extend]
useDefault = true

[[allowlists]]
description = "build output generated from the scanned sources"
paths = [
  '''src-tauri/target/''',
  '''dist/''',
]
